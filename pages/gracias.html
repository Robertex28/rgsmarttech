<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mensaje enviado — R.G Smart Technology</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .gracias-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 5%;position:relative;z-index:1}
    .gracias-ico{font-size:72px;margin-bottom:24px}
    .gracias-titulo{font-family:'Barlow Condensed',sans-serif;font-size:clamp(36px,6vw,64px);font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;line-height:1.05;color:var(--ink)}
    .gracias-titulo span{color:var(--blue)}
    .gracias-sub{font-size:18px;color:var(--ink-muted);line-height:1.75;max-width:480px;margin:0 auto 48px}
    .gracias-back{display:inline-flex;align-items:center;gap:10px;background:var(--blue);color:#fff;padding:16px 40px;border-radius:12px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:1px;text-decoration:none;box-shadow:0 4px 20px rgba(21,96,212,0.25);transition:transform .2s,box-shadow .2s,background .2s}
    .gracias-back:hover{background:var(--blue-dk);transform:translateY(-2px);box-shadow:0 8px 32px rgba(21,96,212,0.40)}
    .gracias-logo{margin-bottom:48px}
    .gracias-logo img{height:56px;width:auto}
  </style>
</head>
<body>
<div class="gracias-wrap">
  <div class="gracias-logo">
    <a href="../index.html"><img src="../assets/img/icono_solo.png" style="height:80px;width:80px;object-fit:contain;background:transparent" alt="R.G Smart Technology"/></a>
  </div>
  <div class="gracias-ico">✅</div>
  <h1 class="gracias-titulo fu d1">¡Mensaje <span>enviado!</span></h1>
  <p class="gracias-sub fu d2">Recibimos tu solicitud. Te contactaremos pronto — normalmente en menos de 2 horas por WhatsApp o email.</p>
  <a href="../index.html" class="gracias-back fu d3">← Volver al inicio</a>
</div>
</body>
</html>
